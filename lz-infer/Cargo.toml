[package]
name = "lz-infer"
version = "0.1.0"
edition = "2021"
description = "Cross-module type inference for the Lang-Zong (.lz) language (.lzi type signatures)"
license = "MIT"
repository = "https://github.com/vicTop-cw/lang-zone"

[dependencies]
lang-zone = { path = "..", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "lz-infer"
path = "src/main.rs"
