[workspace]
members = [".", "lz-infer"]
resolver = "2"

[package]
name = "lang-zone"
version = "0.1.0"
edition = "2021"

[dependencies]
# 零外部依赖：TOML 解析使用 src/util/mini_toml.rs 内嵌实现
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rayon = { version = "1.10", optional = true }

[features]
default = ["infer"]
infer = ["serde", "serde_json"]
parallel = ["rayon"]
