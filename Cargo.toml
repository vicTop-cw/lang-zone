[workspace]
members = [".", "lz-infer", "lz_builtins"]
resolver = "2"

[package]
name = "lang-zone"
version = "0.1.0"
edition = "2021"
description = "Lang-Zong (.lz) language: compiler CLI, parser/typecheck/codegen pipeline and language infrastructure"
license = "MIT"
repository = "https://github.com/vicTop-cw/lang-zone"
readme = "README.md"
# 打包瘦身：排除本地 agent 工具目录、性能报告快照、临时日志/db
exclude = [
  ".atomcode*", ".codeartsdoer*", ".codebuddy*", ".fist-explore-cron*",
  ".fist-night*", ".fist-perf-*", ".fist-wf-*", ".fist-loop-*", ".fist-hunt-*",
  "FIND_BUG", "ERROR_BUG", "PROBE", "backup", "SYNTAX", "BENCH", "div-tools",
  "gate_log.txt", "gate_full_log.txt", "build_log.txt", "_cf.err",
  "TEMP_*", "currentState.txt", "cron-auto-lang.db-*", ".mcp.json", ".github",
]

[dependencies]
# 零外部依赖：TOML 解析使用 src/util/mini_toml.rs 内嵌实现
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
bincode = { version = "1.3", optional = true }
rayon = { version = "1.10", optional = true }
# PyO3：Python 绑定后端，@export(Python) 代码生成的目标依赖
# 精确版本锁定，仅在 py-bridge feature 启用时编译
pyo3 = { version = "0.22.6", optional = true, features = ["extension-module"] }
# tnr 包已改名 tnr-lang 发布到 crates.io（tnr 名被占）；lib 目标名仍是 tnr
# 注：crates.io 上暂无 tnr-lang，先注释；将来发布后解开即可
# tnr = { version = "3.0.0", package = "tnr-lang", optional = true }

[features]
# infer：外部 lz-infer / .lzi 跨模块类型签名（可选增强，非主编译管线依赖；
# 同项目跨模块类型走 --project 源码合并路径）
default = ["infer"]
infer = ["serde", "serde_json", "bincode"]
parallel = ["rayon"]
# tnr-embed：#[embed(tnr)] 原样块经 tnr lib 转译为 Rust 模块（依赖暂缺失，先注释）
# tnr-embed = ["dep:tnr"]
# py-bridge：Python 桥接绑定（PyO3），启用后 @export(Python) 产物可编译
# 未启用时 export(Python) 仅生成绑定源码字符串，不编译 pyo3
py-bridge = ["dep:pyo3"]
