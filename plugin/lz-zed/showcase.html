<script type="text/plain" id="lz-sample">// lz-zed showcase — Lang-Zone (lz) 语法高亮综合示例
// 语法基准: SYNTAX 规范 v3.3

#!bin macro
#![derive(Clone)]

import std.io
from std.collections import List, Dict
import std.collections.HashMap as Map

const MAX_RETRIES: int = 3
type UserId = int

# --- struct 与魔法方法 ------------------------------------------------------

struct User =
    id: UserId
    name: str
    scores: List<int>
    def __init__(self, id: UserId, name: str) =
        self.id = id
        self.name = name
        self.scores = []
    def __str__(self) -> str =
        f"User({self.id}, {self.name})"
    def best(self) -> Option<int> =
        if len(self.scores) == 0:
            None
        else:
            Some(max(self.scores))

# --- enum / trait / impl ----------------------------------------------------

enum Status =
    Active
    Suspended

trait Reportable =
    def report(self) -> str = ...
    def label(self) -> str = "item"

impl Reportable for User =
    def report(self) -> str =
        f"{self.name}: {self.best() ?? -1}"

# --- 函数与闭包 -------------------------------------------------------------

def rank(u: User) -> int =
    let best = u.best() ?? 0
    best

async def fetch_scores(u: User) -> List<int> =
    let raw = await api.scores(u.id)?
    raw |> map(|x| x * 2) |> collect()

def summarize(users: List<User>) -> Dict<str, int> =
    out = {}
    for u in users if u.best() != None:
        out[u.name] = u.best()^
    out

# --- 控制流 -----------------------------------------------------------------

def describe(status: Status) -> str =
    match status:
        case Active => "on"
        case Suspended => "off"
        case _ => "unknown"

def safe_best(u: User) -> int =
    guard let Some(v) = u.best() else:
        return 0
    v

# --- 测试 -------------------------------------------------------------------

suite UserTests:
    setup:
        alice = User(id: 1, name: "Alice")
    teardown:
        cleanup()
    test "best score":
        alice.scores.append(95)
        assert alice.best() == Some(95)
    test "empty best":
        check alice.best() == None

# --- 宏 / 构建块 / 鸭子类型 --------------------------------------------------

macro double_expr(e: Tokens) -> Tokens =
    quote("(" + e + " + " + e + ")")

duck Named =
    require(name)
    def label(self) -> str = ...

greeting =:
    let n = "world"
    f"hello {n}"

first = xs ^:
    0

# --- 数字 / 字符串 / 注释 ----------------------------------------------------

let hex_val = 0xDEAD_BEEF
let oct_val = 0o755
let bin_val = 0b1101
let big = 1_000_000_000
let ratio = 3.14159
let sci = 6.02e23
let raw_re = r"^\d+$"
let multi = """multi
line"""
let msg = f"user={u.name} score={rank(u)}"

# 注释与运算符
total = (a + b) * c / d % e ** f
flag = not ready or (enabled and !blocked)
moved = data^
named_call(limit~, offset~)

<script>
'use strict';
/* ---- mini TextMate tokenizer (port of test/run-tests.js) ---- */
const grammar = JSON.parse(document.getElementById('lz-grammar').textContent);

function compilePatterns(patterns, grammar, seen) {
  const flags = 'myu';
  const strip = (re) => re.replace(/^\(\?m\)/, '');
  const out = [];
  for (const p of patterns) {
    if (p.include !== undefined) {
      const key = p.include.replace(/^#/, '');
      const entry = grammar.repository && grammar.repository[key];
      if (!entry || !entry.patterns) throw new Error('missing repository entry: ' + key);
      if (seen.has(key)) continue;
      out.push(...compilePatterns(entry.patterns, grammar, new Set(seen).add(key)));
      continue;
    }
    if (p.match !== undefined) {
      out.push({ kind: 'match', re: new RegExp(strip(p.match), flags), name: p.name || null });
    } else if (p.begin !== undefined && p.end !== undefined) {
      out.push({
        kind: 'region', beginRe: new RegExp(strip(p.begin), flags), endRe: new RegExp(strip(p.end), flags),
        name: p.name || null, patterns: compilePatterns(p.patterns || [], grammar, seen), beginCaptures: p.beginCaptures || {}
      });
    } else {
      throw new Error('bad pattern');
    }
  }
  return out;
}
const compiled = { root: compilePatterns(grammar.patterns, grammar, new Set()) };

function emitBegin(text, m, p, out) {
  const caps = p.beginCaptures;
  const keys = Object.keys(caps);
  if (keys.length === 0) { out.push({ t: text, s: p.name || '' }); return; }
  const absS = m.index, absE = m.index + m[0].length;
  const ranges = [];
  for (const g of keys) {
    const gi = Number(g), v = m[gi];
    if (v !== undefined && v !== '') {
      const off = m[0].indexOf(v);
      ranges.push({ start: absS + off, end: absS + off + v.length, name: caps[g].name || p.name || '' });
    }
  }
  ranges.sort((a, b) => a.start - b.start);
  let cur = absS;
  for (const r of ranges) {
    if (r.start > cur) out.push({ t: text.slice(cur - absS, r.start - absS), s: p.name || '' });
    out.push({ t: text.slice(r.start - absS, r.end - absS), s: r.name });
    cur = r.end;
  }
  if (cur < absE) out.push({ t: text.slice(cur - absS), s: p.name || '' });
}

function tokenize(source) {
  const out = [], stack = [];
  let pos = 0;
  while (pos < source.length) {
    if (stack.length) {
      const top = stack[stack.length - 1];
      top.endRe.lastIndex = pos;
      const em = top.endRe.exec(source);
      if (em) { out.push({ t: em[0], s: top.name || '' }); pos = em.index + em[0].length; stack.pop(); continue; }
    }
    const pats = stack.length ? stack[stack.length - 1].patterns : compiled.root;
    let hit = false;
    for (const p of pats) {
      if (p.kind === 'match') {
        p.re.lastIndex = pos;
        const m = p.re.exec(source);
        if (m) { out.push({ t: m[0], s: p.name || '' }); pos = m.index + m[0].length; hit = true; break; }
      } else {
        p.beginRe.lastIndex = pos;
        const m = p.beginRe.exec(source);
        if (m) {
          emitBegin(source.slice(m.index, m.index + m[0].length), m, p, out);
          pos = m.index + m[0].length;
          stack.push({ patterns: p.patterns, name: p.name, endRe: p.endRe });
          hit = true; break;
        }
      }
    }
    if (hit) continue;
    out.push({ t: source[pos], s: stack.length ? stack[stack.length - 1].name : 'text' });
    pos += 1;
  }
  return out;
}

/* ---- scope -> css class ---- */
function cls(scope) {
  if (!scope || scope === 'text') return '';
  if (scope.startsWith('comment')) return 'tok-com';
  if (scope.startsWith('string.quoted')) return 'tok-str';
  if (scope.startsWith('constant.numeric')) return 'tok-num';
  if (scope.startsWith('constant.character.escape')) return 'tok-esc';
  if (scope.startsWith('constant')) return 'tok-const';
  if (scope.startsWith('keyword') || scope.startsWith('meta.annotation') || scope.startsWith('meta.preprocessor')) return 'tok-kw';
  if (scope.startsWith('support.type') || scope.startsWith('entity.name.type')) return 'tok-type';
  if (scope.startsWith('support.function') || scope.startsWith('entity.name.function')) return 'tok-fn';
  if (scope.startsWith('string.regexp')) return 'tok-regex';
  if (scope.startsWith('meta.interpolation')) return 'tok-interp';
  if (scope.startsWith('punctuation')) return 'tok-punct';
  return '';
}

/* ---- render ---- */
const out = document.getElementById('out');
const stats = document.getElementById('stats');
const fileInput = document.getElementById('file');
const fileName = document.getElementById('filename');

function render(source, name) {
  const tokens = tokenize(source);
  const lines = [];
  let cur = [];
  for (const tok of tokens) {
    const parts = tok.t.split('\n');
    for (let i = 0; i < parts.length; i++) {
      if (i > 0) { lines.push(cur); cur = []; }
      cur.push({ t: parts[i], s: tok.s });
    }
  }
  lines.push(cur);
  let html = '';
  lines.forEach((line, i) => {
    html += '<span class="ln">' + (i + 1) + '</span>';
    for (const tok of line) {
      const c = cls(tok.s);
      html += c ? '<span class="' + c + '">' + esc(tok.t) + '</span>' : esc(tok.t);
    }
    html += '\n';
  });
  out.innerHTML = html;
  const scopeCount = {};
  let total = 0;
  for (const tok of tokens) { if (tok.s) scopeCount[tok.s] = (scopeCount[tok.s] || 0) + 1; total += 1; }
  const top = Object.entries(scopeCount).sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([k, v]) => k.replace('.lz', '') + '×' + v).join(' · ');
  stats.textContent = name + ' · ' + tokens.length + ' tokens · ' + Object.keys(scopeCount).length + ' scopes' + (top ? '  —  ' + top : '');
  fileName.textContent = name;
}
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

document.getElementById('btn-sample').addEventListener('click', () => {
  render(document.getElementById('lz-sample').textContent.trimStart(), 'demo/showcase.lz（内置）');
});
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => render(String(r.result), f.name);
  r.readAsText(f);
});
render(document.getElementById('lz-sample').textContent.trimStart(), 'demo/showcase.lz（内置）');

/* ---- legend ---- */
const legendItems = [
  ['关键字 keyword.*', 'var(--kw)'], ['字符串 string.*', 'var(--str)'], ['数字 constant.numeric', 'var(--num)'],
  ['注释 comment.*', 'var(--com)'], ['内建类型 support.type', 'var(--type)'], ['内建函数 support.function', 'var(--fn)'],
  ['构造器/常量 constant.language', 'var(--const)'], ['属性宏/装饰器 meta.*', 'var(--attr)'], ['标点 punctuation.*', 'var(--punct)'],
];
document.getElementById('legend').innerHTML = legendItems.map(([label, color]) =>
  '<div><span class="swatch" style="background:' + color + '"></span>' + label + '</div>').join('');
</script>
