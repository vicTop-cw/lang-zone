# lz 3rd-party crate mapping manifest
# "拿来主义" — reuse mature Rust ecosystem crates

[crates]
serde = { version = "1.0", features = "derive" }
serde_json = { version = "1.0" }
tokio = { version = "1", features = "full" }
reqwest = { version = "0.12", features = "json" }
rand = { version = "0.8" }
chrono = { version = "0.4" }
regex = { version = "1" }
log = { version = "0.4" }
thiserror = { version = "2" }
clap = { version = "4", features = "derive" }
uuid = { version = "1", features = "v4" }
base64 = { version = "0.22" }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
once_cell = { version = "1" }
parking_lot = { version = "0.12" }
crossbeam = { version = "0.8" }
rayon = { version = "1" }
itertools = { version = "0.13" }
anyhow = { version = "1" }
