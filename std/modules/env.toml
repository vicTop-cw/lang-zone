# lz std::env — P1 环境变量与进程信息
# 源码级映射：lz 符号 → Rust std::env 路径

[module]
tier = 1
rust_prefix = "std::env"

# ── 自由函数 ──

[functions]
var           = { rust = "std::env::var",           shim = "" }
set_var       = { rust = "std::env::set_var",       shim = "" }
remove_var    = { rust = "std::env::remove_var",    shim = "" }
current_dir   = { rust = "std::env::current_dir",   shim = "" }
set_current_dir = { rust = "std::env::set_current_dir", shim = "" }
args          = { rust = "std::env::args",          shim = "" }
home_dir      = { rust = "std::env::home_dir",      shim = "" }
temp_dir      = { rust = "std::env::temp_dir",      shim = "" }
join_paths    = { rust = "std::env::join_paths",    shim = "" }

# ── 类型映射 ──

[types]
Args       = "std::env::Args"
ArgsOs     = "std::env::ArgsOs"
Vars       = "std::env::Vars"
VarsOs     = "std::env::VarsOs"
VarError   = "std::env::VarError"
JoinPathsError = "std::env::JoinPathsError"

# ── 类型别名注入 ──

[aliases]
